workflows:
  ios-framework:
    name: "Step 9 - iOS simulator framework"
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: "26.4"
      java: 17

    scripts:
      - name: Prepare Android SDK for Gradle
        script: |
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          fi

      - name: Build ComposeApp framework
        script: |
          chmod +x gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

    artifacts:
      - composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework/**