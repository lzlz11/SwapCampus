workflows:
  ios-framework:
    name: SwapCampus - complete iOS simulator app
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.4"
      java: 17
    scripts:
      - name: Prepare Android SDK for Kotlin Gradle configuration
        script: bash scripts/prepare-android-sdk.sh
      - name: Build and launch complete app in iPhone simulator
        script: bash scripts/ios-simulator-smoke.sh
    artifacts:
      - iosApp/build/artifacts/**
