name: Android and iOS builds

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: bash scripts/prepare-android-sdk.sh
      - run: bash gradlew :androidApp:assembleDebug :androidApp:lintDebug :composeApp:compileCommonMainKotlinMetadata --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/reports/lint-results-debug.html

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-2.4.21
      - run: bash scripts/prepare-android-sdk.sh
      - run: bash scripts/ios-simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: iosApp/build/artifacts/**
